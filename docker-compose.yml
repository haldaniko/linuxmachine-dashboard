services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest-debian
    environment:
      COLLECTIONS: crowdsecurity/linux
      DISABLE_ONLINE_API: "true"
      METRICS_PORT: "6060"
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data

  backend:
    build:
      context: ./backend
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SQLITE_DB_PATH: /app/data/db.sqlite3
      CROWDSEC_METRICS_URL: http://crowdsec:6060/metrics
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
      - crowdsec_config:/etc/crowdsec:ro
    depends_on:
      - crowdsec
    command: sh -c "python manage.py migrate && python manage.py bootstrap_runtime && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  sqlite_data:
  frontend_node_modules:
  crowdsec_config:
  crowdsec_data:
